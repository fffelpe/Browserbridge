<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BrowserBridge — Configurações</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <div class="heading">
      <div class="logo">BB</div>
      <div>
        <h1>BrowserBridge</h1>
        <p>Configurações de sincronização local</p>
      </div>
    </div>

    <section>
      <h2>Navegadores de origem</h2>
      <label><input id="chrome" type="checkbox"> Google Chrome</label>
      <label><input id="edge" type="checkbox"> Microsoft Edge</label>
      <label><input id="brave" type="checkbox"> Brave</label>
    </section>

    <section>
      <h2>Dados</h2>
      <label><input id="syncBookmarks" type="checkbox"> Favoritos</label>
      <label><input id="syncHistory" type="checkbox"> Histórico</label>

      <div class="field">
        <label for="historyDays">Importar histórico dos últimos</label>
        <select id="historyDays">
          <option value="1">1 dia</option>
          <option value="7">7 dias</option>
          <option value="30">30 dias</option>
          <option value="90">90 dias</option>
          <option value="365">1 ano</option>
        </select>
      </div>
    </section>

    <section>
      <h2>Bridge local</h2>
      <p id="detect-result">Ainda não testado.</p>
      <button id="detect">Detectar navegadores</button>
    </section>

    <div class="actions">
      <button id="save" class="primary">Salvar configurações</button>
      <span id="saved"></span>
    </div>

    <script src="options.js"></script>
  </main>
</body>
</html>
